    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #F9F9F9; color: #0F0F0F; overflow-x: hidden; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        .modal { visibility: hidden; opacity: 0; transition: all 0.3s ease-in-out; }
        .modal.open { visibility: visible; opacity: 1; }
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease-in-out; }
        .modal.open .modal-content { transform: scale(1); }

        .lightbox { visibility: hidden; opacity: 0; transition: all 0.3s ease; }
        .lightbox.active { visibility: visible; opacity: 1; }

        .magazine-gradient {
            background: linear-gradient(90deg, #F9F9F9 35%, rgba(249,249,249,0.85) 55%, rgba(249,249,249,0) 100%);
        }
        @media (max-width: 768px) {
            .magazine-gradient {
                background: linear-gradient(90deg, #F9F9F9 50%, rgba(249,249,249,0.7) 80%, rgba(249,249,249,0) 100%);
            }
        }
        
        .iti { width: 100%; }
        .iti__flag-container { z-index: 10; }
    </style>
